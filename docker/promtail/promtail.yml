server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: laravel
    static_configs:
      - targets:
          - localhost
        labels:
          job: laravel
          app: takeer
          environment: local
          __path__: /var/log/takeer/laravel/*.log
    pipeline_stages:
      - multiline:
          firstline: '^\[[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\]'
          max_wait_time: 3s
      - regex:
          expression: '^\[(?P<timestamp>[^\]]+)\] (?P<environment>[A-Za-z0-9_-]+)\.(?P<level>[A-Z]+): (?P<message>[\s\S]*)'
      - labels:
          level:
          environment:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
      - drop:
          older_than: 24h

  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: takeer-local
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 24h
