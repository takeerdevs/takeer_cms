server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: takeer-local
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 24h
