<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Upload is too large</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #111827;
            --muted: #5b6472;
            --line: #d9dee7;
            --brand: #0f8b8d;
            --accent: #f4b942;
            --page: #f7f8fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                linear-gradient(135deg, rgba(15, 139, 141, 0.08), transparent 38%),
                linear-gradient(315deg, rgba(244, 185, 66, 0.14), transparent 42%),
                var(--page);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 24px;
        }

        main {
            width: min(100%, 560px);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.92);
            padding: clamp(28px, 7vw, 48px);
            box-shadow: 0 20px 55px rgba(17, 24, 39, 0.08);
        }

        .mark {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: var(--ink);
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 24px;
        }

        p.code {
            margin: 0 0 10px;
            color: var(--brand);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 8vw, 42px);
            line-height: 1.05;
            letter-spacing: 0;
        }

        p.message {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.65;
        }

        a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            margin-top: 28px;
            padding: 0 18px;
            border-radius: 8px;
            background: var(--ink);
            color: white;
            text-decoration: none;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">T</div>
        <p class="code">Upload limit</p>
        <h1>That file is too large.</h1>
        <p class="message">Please try a smaller file, compress it, or split the upload into parts before trying again.</p>
        <a href="/">Back to Takeer</a>
    </main>
</body>
</html>
