services:
  proxy:
    image: nginx:1.27-alpine
    container_name: takeer_proxy_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/errors:/usr/share/nginx/html/errors:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - takeer_network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    expose:
      - "80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=info
      - TRUSTED_PROXIES=*
      - APP_OPTIMIZE_ON_BOOT=true
      - RUN_MIGRATIONS=false
      - HORIZON_PATH=admin/horizon
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - SESSION_CONNECTION=session
      - CACHE_STORE=redis
      - CACHE_PREFIX=takeer_cache
      - QUEUE_CONNECTION=redis
      - REDIS_CACHE_CONNECTION=cache
      - REDIS_CACHE_LOCK_CONNECTION=default
      - REDIS_QUEUE_CONNECTION=queue
      - REDIS_QUEUE=default
      - REDIS_QUEUE_RETRY_AFTER=2100
      - REDIS_QUEUE_BLOCK_FOR=5
      - REDIS_DB=0
      - REDIS_CACHE_DB=1
      - REDIS_QUEUE_DB=2
      - REDIS_SESSION_DB=3
      - "REDIS_PREFIX=takeer:"
      - FILESYSTEM_DISK=s3
      - PUBLIC_FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=takeer_minio
      - AWS_SECRET_ACCESS_KEY=takeer_minio_secret
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=takeer-media
      - AWS_PRIVATE_BUCKET=takeer-media
      - AWS_PRIVATE_URL=http://localhost:9000/takeer-media
      - AWS_PUBLIC_BUCKET=takeer-media
      - AWS_PUBLIC_URL=http://localhost:9000/takeer-media
      - AWS_ENDPOINT=http://minio:9000
      - AWS_TEMPORARY_ENDPOINT=http://localhost:9000
      - AWS_TEMPORARY_URL=http://localhost:9000/takeer-media
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - FLARESOLVERR_TIMEOUT=15000
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - takeer_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    stop_signal: SIGTERM
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=info
      - TRUSTED_PROXIES=*
      - HORIZON_PATH=admin/horizon
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - SESSION_CONNECTION=session
      - CACHE_STORE=redis
      - CACHE_PREFIX=takeer_cache
      - QUEUE_CONNECTION=redis
      - REDIS_CACHE_CONNECTION=cache
      - REDIS_CACHE_LOCK_CONNECTION=default
      - REDIS_QUEUE_CONNECTION=queue
      - REDIS_QUEUE=default
      - REDIS_QUEUE_RETRY_AFTER=2100
      - REDIS_QUEUE_BLOCK_FOR=5
      - REDIS_DB=0
      - REDIS_CACHE_DB=1
      - REDIS_QUEUE_DB=2
      - REDIS_SESSION_DB=3
      - "REDIS_PREFIX=takeer:"
      - FILESYSTEM_DISK=s3
      - PUBLIC_FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=takeer_minio
      - AWS_SECRET_ACCESS_KEY=takeer_minio_secret
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=takeer-media
      - AWS_PRIVATE_BUCKET=takeer-media
      - AWS_PRIVATE_URL=http://localhost:9000/takeer-media
      - AWS_PUBLIC_BUCKET=takeer-media
      - AWS_PUBLIC_URL=http://localhost:9000/takeer-media
      - AWS_ENDPOINT=http://minio:9000
      - AWS_TEMPORARY_ENDPOINT=http://localhost:9000
      - AWS_TEMPORARY_URL=http://localhost:9000/takeer-media
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - FLARESOLVERR_TIMEOUT=15000
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      #app:
      #  condition: service_healthy
    networks:
      - takeer_network
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: takeer_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=takeer_minio
      - MINIO_ROOT_PASSWORD=takeer_minio_secret
    volumes:
      - minio_dev_data:/data
    networks:
      - takeer_network

  minio-init:
    image: minio/mc:latest
    container_name: takeer_minio_init_dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 takeer_minio takeer_minio_secret; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/takeer-media;
      /usr/bin/mc anonymous set none local/takeer-media || true;
      for prefix in posts products variant-swatches content avatars course-covers share-cards link-previews feed processed dispatch-proofs dispatch-receipts delivery-events rider-delivery-proofs dispute-videos service-disputes return-requests; do
        /usr/bin/mc anonymous set download local/takeer-media/$$prefix || true;
      done;
      "
    networks:
      - takeer_network

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: takeer_soketi_dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SOKETI_DEFAULT_APP_ID=takeer-local
      - SOKETI_DEFAULT_APP_KEY=takeer-key
      - SOKETI_DEFAULT_APP_SECRET=takeer-secret
      - SOKETI_DEBUG=1
      - SOKETI_PORT=8081
      - SOKETI_METRICS_ENABLED=true
      - METRICS_ENABLED=1
      - SOKETI_METRICS_SERVER_PORT=9601
    networks:
      - takeer_network

  postgres:
    platform: linux/arm64
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: takeer_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-takeerms}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - takeer_revised_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - takeer_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-takeerms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: takeer_pgbouncer_dev
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint-with-secrets.sh"]
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_DATABASE:-takeerms}
      - DB_USER=${DB_USERNAME:-postgres}
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - AUTH_TYPE=plain
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=40
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=10
      - SERVER_IDLE_TIMEOUT=60
      - SERVER_RESET_QUERY=DISCARD ALL
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    volumes:
      - ./docker/pgbouncer/entrypoint-with-secrets.sh:/usr/local/bin/entrypoint-with-secrets.sh:ro
    expose:
      - "5432"
    ports:
      - "6432:5432"
    networks:
      - takeer_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-takeerms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: takeer_flaresolverr_dev
    environment:
      - LOG_LEVEL=info
      - TZ=Africa/Dar_es_Salaam
    ports:
      - "8192:8191"
    networks:
      - takeer_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: takeer_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"
    networks:
      - takeer_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: takeer_grafana_dev
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3333}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-takeer_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - takeer_network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: takeer_prometheus_dev
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - prometheus_dev_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - takeer_network

  loki:
    image: grafana/loki:3.2.1
    container_name: takeer_loki_dev
    profiles:
      - monitoring
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "3100:3100"
    volumes:
      - loki_dev_data:/loki
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
    networks:
      - takeer_network

  promtail:
    image: grafana/promtail:3.2.1
    container_name: takeer_promtail_dev
    profiles:
      - monitoring
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_dev_positions:/positions
    depends_on:
      - loki
    networks:
      - takeer_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: takeer_cadvisor_dev
    profiles:
      - monitoring
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - takeer_network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: takeer_node_exporter_dev
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - takeer_network

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: takeer_redis_exporter_dev
    profiles:
      - monitoring
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9121"
    networks:
      - takeer_network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: takeer_postgres_exporter_dev
    profiles:
      - monitoring
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint-with-secrets.sh"]
    environment:
      - DATA_SOURCE_URI=postgres:5432/${DB_DATABASE:-takeerms}?sslmode=disable
      - DATA_SOURCE_USER=${DB_USERNAME:-postgres}
      - DATA_SOURCE_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./docker/postgres-exporter/entrypoint-with-secrets.sh:/usr/local/bin/entrypoint-with-secrets.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9187"
    networks:
      - takeer_network

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    container_name: takeer_pgbouncer_exporter_dev
    profiles:
      - monitoring
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint-with-secrets.sh"]
    environment:
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_USER=${DB_USERNAME:-postgres}
      - PGBOUNCER_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./docker/pgbouncer-exporter/entrypoint-with-secrets.sh:/usr/local/bin/entrypoint-with-secrets.sh:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
    expose:
      - "9127"
    networks:
      - takeer_network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: takeer_blackbox_exporter_dev
    profiles:
      - monitoring
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    networks:
      - takeer_network

networks:
  takeer_network:
    driver: bridge

volumes:
  takeer_revised_data:
  redis_dev_data:
  minio_dev_data:
  grafana_dev_data:
  prometheus_dev_data:
  loki_dev_data:
  promtail_dev_positions:

secrets:
  postgres_password:
    environment: DB_PASSWORD
